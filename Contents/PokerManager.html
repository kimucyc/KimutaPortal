<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Manager</title>
  
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React本体 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel (Reactの文法をブラウザが読める形に変換するツール) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0f172a; color: white; margin: 0; }
  </style>
</head>
<body>
  <!-- ここにReactのアプリが描画されます -->
  <div id="root"></div>

  <!-- type="text/babel" とすることで、ブラウザ上でReactコードが動くようになります -->
  <script type="text/babel">
    const { useState } = React;

    // --- アイコンコンポーネント (lucide-reactの代わり) ---
    const Icon = ({ children, className = "w-5 h-5", ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );
    const CircleDollarSign = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></Icon>;
    const Play = (props) => <Icon {...props}><polygon points="5 3 19 12 5 21 5 3"/></Icon>;
    const ChevronRight = (props) => <Icon {...props}><polyline points="9 18 15 12 9 6"/></Icon>;
    const Trophy = (props) => <Icon {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></Icon>;
    const Users = (props) => <Icon {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
    const Settings = (props) => <Icon {...props}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;
    const Database = (props) => <Icon {...props}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></Icon>;
    const Flag = (props) => <Icon {...props}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></Icon>;
    const RefreshCw = (props) => <Icon {...props}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></Icon>;

    // --- メインアプリ ---
    function App() {
      // --- Game Settings State ---
      const [setupMode, setSetupMode] = useState(true);
      const [playerCount, setPlayerCount] = useState(4);
      const [initialChips, setInitialChips] = useState(1000);
      const [smallBlind, setSmallBlind] = useState(10);
      const [maxRoundsInput, setMaxRoundsInput] = useState(''); // 空欄は無制限
      
      // プレイヤー名の入力用ステート (最大10人分確保)
      const [playerNames, setPlayerNames] = useState(
        Array.from({ length: 10 }, (_, i) => `Player ${i + 1}`)
      );
      
      // --- Game State ---
      const [players, setPlayers] = useState([]);
      const [pot, setPot] = useState(0);
      const [currentMaxBet, setCurrentMaxBet] = useState(0);
      const [dealerIndex, setDealerIndex] = useState(0);
      const [turnIndex, setTurnIndex] = useState(0);
      const [phase, setPhase] = useState('preflop'); 
      const [raiseInput, setRaiseInput] = useState(0);
      const [winners, setWinners] = useState([]);
      
      const [currentRound, setCurrentRound] = useState(1);
      const [maxRounds, setMaxRounds] = useState(null);
      
      // --- Overlay State ---
      const [overlayMessage, setOverlayMessage] = useState(null); 

      // --- Handlers ---
      const handleNameChange = (index, newName) => {
        const updatedNames = [...playerNames];
        updatedNames[index] = newName;
        setPlayerNames(updatedNames);
      };

      const showOverlay = (title, subtitle = '', duration = 3000) => {
        setOverlayMessage({ title, subtitle });
        if (duration > 0) {
          setTimeout(() => {
            setOverlayMessage(null);
          }, duration);
        }
      };

      const startGame = () => {
        const parsedMaxRounds = parseInt(maxRoundsInput, 10);
        setMaxRounds(isNaN(parsedMaxRounds) || parsedMaxRounds <= 0 ? null : parsedMaxRounds);
        setCurrentRound(1);

        const newPlayers = Array.from({ length: playerCount }, (_, i) => ({
          id: i,
          name: playerNames[i].trim() !== '' ? playerNames[i] : `Player ${i + 1}`,
          chips: initialChips,
          roundBet: 0,
          status: 'active',
          hasActed: false
        }));
        setPlayers(newPlayers);
        setSetupMode(false);
        setDealerIndex(0);
        startNewHand(newPlayers, 0);
      };

      const startNewHand = (currentPlayers, dealerIdx) => {
        const bigBlind = smallBlind * 2;
        setPot(0);
        setPhase('preflop');
        setCurrentMaxBet(bigBlind);
        setWinners([]);
        
        let updatedPlayers = currentPlayers.map(p => ({
          ...p,
          roundBet: 0,
          status: p.chips > 0 ? 'active' : 'folded',
          hasActed: false
        }));

        let sbIndex, bbIndex, firstActIndex;
        if (currentPlayers.length === 1) {
          sbIndex = 0; bbIndex = 0; firstActIndex = 0;
        } else if (currentPlayers.length === 2) {
          sbIndex = dealerIdx;
          bbIndex = (dealerIdx + 1) % 2;
          firstActIndex = dealerIdx;
        } else {
          sbIndex = (dealerIdx + 1) % currentPlayers.length;
          bbIndex = (dealerIdx + 2) % currentPlayers.length;
          firstActIndex = (dealerIdx + 3) % currentPlayers.length;
        }

        const collectBlind = (idx, amount) => {
          let actualAmount = Math.min(updatedPlayers[idx].chips, amount);
          updatedPlayers[idx].chips -= actualAmount;
          updatedPlayers[idx].roundBet = actualAmount;
          if (updatedPlayers[idx].chips === 0) {
            updatedPlayers[idx].status = 'all-in';
          }
        };

        if (updatedPlayers[sbIndex]?.status === 'active') collectBlind(sbIndex, smallBlind);
        if (updatedPlayers[bbIndex]?.status === 'active' && currentPlayers.length > 1) collectBlind(bbIndex, bigBlind);

        setPlayers(updatedPlayers);
        setTurnIndex(firstActIndex);
        
        showOverlay(`ラウンド ${currentRound} 開始`, '各プレイヤーに2枚ずつカードを配ってください');
        
        advanceTurn(updatedPlayers, firstActIndex, true);
      };

      const advanceTurn = (currentPlayers, startIdx, isInit = false) => {
        let nextIdx = isInit ? startIdx : (startIdx + 1) % currentPlayers.length;
        let found = false;
        let loops = 0;

        while (loops < currentPlayers.length) {
          if (currentPlayers[nextIdx].status === 'active' && 
              (!currentPlayers[nextIdx].hasActed || currentPlayers[nextIdx].roundBet < currentMaxBet)) {
            found = true;
            break;
          }
          nextIdx = (nextIdx + 1) % currentPlayers.length;
          loops++;
        }

        const activeAndNotActed = currentPlayers.filter(p => 
          p.status === 'active' && (!p.hasActed || p.roundBet < currentMaxBet)
        );
        const notFolded = currentPlayers.filter(p => p.status !== 'folded');

        if (notFolded.length <= 1) {
          endHand(currentPlayers);
          return;
        }

        if (activeAndNotActed.length === 0) {
          nextRound(currentPlayers);
        } else {
          setTurnIndex(nextIdx);
          setRaiseInput(Math.max(currentMaxBet * 2, currentMaxBet + smallBlind * 2));
        }
      };

      const nextRound = (currentPlayers) => {
        let roundPot = 0;
        let updatedPlayers = currentPlayers.map(p => {
          roundPot += p.roundBet;
          return { ...p, roundBet: 0, hasActed: false };
        });

        setPot(prev => prev + roundPot);
        setCurrentMaxBet(0);

        const phases = ['preflop', 'flop', 'turn', 'river', 'showdown'];
        const currentPhaseIdx = phases.indexOf(phase);
        
        if (currentPhaseIdx === phases.length - 2) {
          setPhase('showdown');
          setPlayers(updatedPlayers);
          showOverlay('ショーダウン', 'プレイヤーは手札を公開してください', 0);
        } else if (currentPhaseIdx < phases.length - 2) {
          const nextPhase = phases[currentPhaseIdx + 1];
          setPhase(nextPhase);
          setPlayers(updatedPlayers);
          
          if (nextPhase === 'flop') {
            showOverlay('フロップ', 'ボードに3枚のカードを開いてください', 4000);
          } else if (nextPhase === 'turn') {
            showOverlay('ターン', 'ボードに1枚のカードを開いてください', 4000);
          } else if (nextPhase === 'river') {
            showOverlay('リバー', 'ボードに最後の1枚を開いてください', 4000);
          }
          
          advanceTurn(updatedPlayers, dealerIndex);
        }
      };

      const endHand = (currentPlayers) => {
        const notFolded = currentPlayers.filter(p => p.status !== 'folded');
        let roundPot = 0;
        const finalPlayers = currentPlayers.map(p => {
          roundPot += p.roundBet;
          return { ...p, roundBet: 0 };
        });
        
        setPot(prev => prev + roundPot);
        setCurrentMaxBet(0);
        setPlayers(finalPlayers);
        setOverlayMessage(null);

        if (notFolded.length === 1) {
          const winner = notFolded[0];
          setPhase('result');
          distributePot(finalPlayers, [winner.id], pot + roundPot);
          showOverlay(`${winner.name} の勝利!`, '他のプレイヤーが全員フォールドしました');
        } else {
          setPhase('showdown');
        }
      };

      const distributePot = (currentPlayers, winnerIds, totalPot) => {
        if (winnerIds.length === 0) return;
        
        const winAmount = Math.floor(totalPot / winnerIds.length);
        const remainder = totalPot % winnerIds.length;
        
        const newPlayers = currentPlayers.map(p => {
          if (winnerIds.includes(p.id)) {
            return { ...p, chips: p.chips + winAmount + (p.id === winnerIds[0] ? remainder : 0) };
          }
          return p;
        });

        setPlayers(newPlayers);
      };

      const confirmShowdownWinners = () => {
        if (winners.length === 0) {
          alert('勝者を1人以上選択してください');
          return;
        }
        setOverlayMessage(null);
        setPhase('result');
        distributePot(players, winners, pot);
      };

      const nextHand = () => {
        setOverlayMessage(null);
        
        if (maxRounds !== null && currentRound >= maxRounds) {
          setPhase('gameover');
          return;
        }

        setCurrentRound(prev => prev + 1);
        const nextDealer = (dealerIndex + 1) % playerCount;
        setDealerIndex(nextDealer);
        startNewHand(players, nextDealer);
      };

      const resetGame = () => {
        setSetupMode(true);
        setPhase('preflop');
        setOverlayMessage(null);
      };

      const handleAction = (action, amount = 0) => {
        let updatedPlayers = [...players];
        let player = { ...updatedPlayers[turnIndex] };
        let newMaxBet = currentMaxBet;

        switch (action) {
          case 'fold':
            player.status = 'folded';
            break;

          case 'check':
            player.hasActed = true;
            break;

          case 'call':
            const callAmount = currentMaxBet - player.roundBet;
            const actualCall = Math.min(player.chips, callAmount);
            player.chips -= actualCall;
            player.roundBet += actualCall;
            player.hasActed = true;
            if (player.chips === 0) {
              player.status = 'all-in';
            }
            break;

          case 'raise':
            const totalBet = parseInt(amount, 10);
            if (isNaN(totalBet) || totalBet <= currentMaxBet) return;
            
            const raiseAdd = totalBet - player.roundBet;
            const actualRaise = Math.min(player.chips, raiseAdd);
            
            player.chips -= actualRaise;
            player.roundBet += actualRaise;
            player.hasActed = true;
            newMaxBet = player.roundBet;
            setCurrentMaxBet(newMaxBet);

            updatedPlayers = updatedPlayers.map((p, idx) => {
              if (idx !== turnIndex && p.status === 'active') {
                return { ...p, hasActed: false };
              }
              return p;
            });

            if (player.chips === 0) {
              player.status = 'all-in';
            }
            break;
          
          default:
            break;
        }

        updatedPlayers[turnIndex] = player;
        setPlayers(updatedPlayers);
        advanceTurn(updatedPlayers, turnIndex);
      };

      // --- UI Components ---
      if (setupMode) {
        return (
          <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4">
            <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-700 max-h-[95vh] overflow-y-auto">
              <h1 className="text-3xl font-bold mb-8 text-center text-emerald-400 flex items-center justify-center gap-3">
                <Trophy className="w-8 h-8" />
                Poker Manager
              </h1>
              
              <div className="space-y-8">
                {/* プレイヤー数と名前設定 */}
                <div className="space-y-4">
                  <div className="flex items-center gap-2 text-emerald-400 font-bold border-b border-slate-700 pb-2">
                    <Users className="w-5 h-5" />
                    <h2>プレイヤー設定</h2>
                  </div>
                  
                  <div>
                    <label className="block text-sm font-medium text-slate-400 mb-2">参加人数 (1〜10人)</label>
                    <select
                      value={playerCount}
                      onChange={(e) => setPlayerCount(Number(e.target.value))}
                      className="w-full bg-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-bold cursor-pointer"
                    >
                      {[...Array(10)].map((_, i) => (
                        <option key={i + 1} value={i + 1}>{i + 1}人</option>
                      ))}
                    </select>
                  </div>

                  <div className="space-y-3 mt-4">
                    <label className="block text-sm font-medium text-slate-400">プレイヤー名</label>
                    {Array.from({ length: playerCount }).map((_, i) => (
                      <div key={i} className="flex items-center gap-3 bg-slate-900/50 p-2 rounded-xl border border-slate-700 focus-within:border-emerald-500 transition-colors">
                         <span className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold text-slate-400">
                            {i + 1}
                         </span>
                        <input
                          type="text"
                          value={playerNames[i]}
                          onChange={(e) => handleNameChange(i, e.target.value)}
                          placeholder={`Player ${i + 1}`}
                          className="flex-1 bg-transparent text-white px-2 py-1 outline-none font-medium focus:text-emerald-300"
                        />
                      </div>
                    ))}
                  </div>
                </div>

                {/* ゲームルールの設定 */}
                <div className="space-y-4">
                  <div className="flex items-center gap-2 text-emerald-400 font-bold border-b border-slate-700 pb-2">
                    <Settings className="w-5 h-5" />
                    <h2>ゲームルール設定</h2>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-400 mb-2">
                        初期チップ
                      </label>
                      <div className="relative">
                        <CircleDollarSign className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"/>
                        <input 
                          type="number" 
                          value={initialChips}
                          onChange={e => setInitialChips(Number(e.target.value))}
                          className="w-full bg-slate-700 text-white pl-9 pr-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-bold"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-slate-400 mb-2">
                        SB (BBは自動で2倍)
                      </label>
                      <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">SB</span>
                        <input 
                          type="number" 
                          value={smallBlind}
                          onChange={e => setSmallBlind(Number(e.target.value))}
                          className="w-full bg-slate-700 text-white pl-9 pr-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-bold"
                        />
                      </div>
                    </div>
                  </div>
                  
                  <div>
                    <label className="block text-sm font-medium text-slate-400 mb-2">
                      ラウンド(ハンド)上限
                    </label>
                    <div className="relative">
                      <Flag className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"/>
                      <input 
                        type="number" 
                        value={maxRoundsInput}
                        onChange={e => setMaxRoundsInput(e.target.value)}
                        placeholder="空欄で無制限"
                        className="w-full bg-slate-700 text-white pl-9 pr-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-bold"
                      />
                    </div>
                  </div>
                </div>

                <button 
                  onClick={startGame}
                  className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-xl flex items-center justify-center gap-2 mt-8 shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-transform hover:scale-[1.02] active:scale-95"
                >
                  <Play fill="currentColor" className="w-5 h-5" />
                  ゲームを開始する
                </button>
              </div>
            </div>
          </div>
        );
      }

      // === Game Over Phase ===
      if (phase === 'gameover') {
        const sortedPlayers = [...players].sort((a, b) => b.chips - a.chips);
        return (
          <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4">
            <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border-2 border-emerald-500 text-center relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-400 via-emerald-500 to-amber-400"></div>
              
              <h2 className="text-4xl font-black text-amber-400 mb-2 mt-4">GAME OVER</h2>
              <p className="text-slate-400 mb-8 font-bold">全ラウンド ({maxRounds}ラウンド) 終了</p>
              
              <div className="space-y-4 mb-8">
                {sortedPlayers.map((p, idx) => (
                  <div key={p.id} className={`flex items-center justify-between p-4 rounded-2xl border ${idx === 0 ? 'bg-amber-500/20 border-amber-500/50' : 'bg-slate-700/50 border-slate-600'}`}>
                    <div className="flex items-center gap-4">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black ${idx === 0 ? 'bg-amber-400 text-amber-900' : 'bg-slate-600 text-slate-300'}`}>
                        {idx + 1}
                      </div>
                      <span className={`font-bold text-lg ${idx === 0 ? 'text-amber-300' : 'text-slate-200'}`}>
                        {p.name}
                      </span>
                    </div>
                    <div className="flex items-center gap-1 font-black text-xl">
                      <CircleDollarSign className={idx === 0 ? 'text-amber-400' : 'text-slate-400'} />
                      <span className={idx === 0 ? 'text-amber-400' : 'text-white'}>{p.chips}</span>
                    </div>
                  </div>
                ))}
              </div>

              <button 
                onClick={resetGame}
                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95"
              >
                <RefreshCw className="w-5 h-5" />
                タイトルへ戻る
              </button>
            </div>
          </div>
        );
      }

      const currentPlayer = players[turnIndex];
      const isPlayingPhase = ['preflop', 'flop', 'turn', 'river'].includes(phase);

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans relative overflow-hidden">
          
          {/* 画面全体を覆うオーバーレイメッセージ */}
          {overlayMessage && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm animate-in fade-in duration-300">
              <div className="bg-slate-800 p-8 md:p-12 rounded-3xl shadow-[0_0_50px_rgba(16,185,129,0.3)] border-2 border-emerald-500 text-center max-w-lg mx-4 transform scale-100 animate-[pulse_2s_infinite]">
                <h2 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-wider">
                  {overlayMessage.title}
                </h2>
                {overlayMessage.subtitle && (
                  <p className="text-xl md:text-2xl text-emerald-400 font-bold">
                    {overlayMessage.subtitle}
                  </p>
                )}
                {phase === 'showdown' && (
                   <button 
                     onClick={() => setOverlayMessage(null)}
                     className="mt-8 bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-full font-bold"
                   >
                     閉じる
                   </button>
                )}
              </div>
            </div>
          )}

          {/* Main Table Area */}
          <div className="flex-1 p-4 md:p-8 flex flex-col relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-emerald-900 to-slate-900">

            {/* Phase & Round Info (Top Left) */}
            <div className="absolute top-4 left-4 z-10 flex flex-col gap-2">
              <div className="bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-sm flex items-center gap-2">
                 <Flag className="w-4 h-4 text-emerald-400" />
                 <span className="text-slate-200 font-bold text-sm tracking-wider">
                   ROUND {currentRound} {maxRounds ? `/ ${maxRounds}` : ''}
                 </span>
              </div>
              <div className="bg-emerald-900/60 px-4 py-2 rounded-xl border border-emerald-600/50 backdrop-blur-sm text-center">
                 <span className="text-emerald-300 text-xs font-bold uppercase tracking-widest">{phase} Phase</span>
              </div>
            </div>

            {/* Players Layout & Center Pot */}
            <div className="flex-1 relative flex items-center justify-center min-h-[50vh] mt-8 md:mt-0">
              {/* Table outline */}
              <div className="absolute inset-8 md:inset-24 border-8 border-emerald-600/30 rounded-full pointer-events-none shadow-[inset_0_0_50px_rgba(0,0,0,0.5)] bg-emerald-800/20"></div>

              {/* --- Center Pot Display --- */}
              <div className="absolute z-10 flex flex-col items-center justify-center pointer-events-none">
                <div className="bg-slate-900/90 backdrop-blur-md p-6 md:p-8 rounded-full border-4 border-amber-500/50 shadow-[0_0_40px_rgba(245,158,11,0.2)] flex flex-col items-center justify-center min-w-[150px] md:min-w-[200px]">
                   <Database className="w-8 h-8 md:w-10 md:h-10 text-amber-500 mb-2 opacity-80" />
                   <div className="text-amber-500 text-xs md:text-sm font-bold tracking-widest mb-1">MAIN POT</div>
                   <div className="text-4xl md:text-6xl font-black text-amber-400 drop-shadow-md">
                     {pot}
                   </div>
                </div>
              </div>

              {/* --- Players --- */}
              {players.map((player, idx) => {
                const angle = (idx / playerCount) * 2 * Math.PI - Math.PI / 2;
                const radius = 42; 
                const top = `calc(50% + ${Math.sin(angle) * radius}%)`;
                const left = `calc(50% + ${Math.cos(angle) * radius}%)`;
                
                const isTurn = isPlayingPhase && turnIndex === idx;
                const isDealer = dealerIndex === idx;

                return (
                  <div 
                    key={player.id} 
                    className={`absolute -translate-x-1/2 -translate-y-1/2 w-36 md:w-48 transition-all duration-300 ${
                      isTurn ? 'scale-110 z-20' : 'scale-100 z-10'
                    } ${player.status === 'folded' ? 'opacity-40 grayscale' : 'opacity-100'}`}
                    style={{ top, left }}
                  >
                    {isDealer && (
                      <div className="absolute -top-3 -right-3 w-8 h-8 md:w-10 md:h-10 bg-white text-black font-black rounded-full flex items-center justify-center border-4 border-slate-300 shadow-lg z-30 text-xs md:text-sm">
                        D
                      </div>
                    )}
                    
                    <div className={`bg-slate-800/95 backdrop-blur rounded-2xl p-3 md:p-4 border-2 shadow-2xl relative overflow-hidden flex flex-col gap-2 ${
                      isTurn ? 'border-amber-400 shadow-[0_0_30px_rgba(251,191,36,0.3)] ring-4 ring-amber-500/20' : 
                      player.status === 'folded' ? 'border-slate-700' : 'border-slate-600'
                    }`}>
                      {player.status !== 'active' && (
                        <div className="absolute -right-8 top-3 bg-red-900/90 text-white text-[10px] md:text-xs font-bold py-1 px-10 rotate-45 border-y border-red-500/50 z-10">
                          {player.status.toUpperCase()}
                        </div>
                      )}

                      <div className="flex items-center gap-2">
                         <div className={`w-2 h-2 md:w-3 md:h-3 rounded-full shrink-0 ${isTurn ? 'bg-amber-400 animate-pulse' : 'bg-slate-600'}`}></div>
                         <div className="font-bold text-sm md:text-lg text-emerald-100 truncate">{player.name}</div>
                      </div>
                      
                      <div className="flex items-center gap-1 text-xl md:text-3xl font-black text-amber-300">
                        <CircleDollarSign className="w-4 h-4 md:w-6 md:h-6 text-amber-500"/>
                        {player.chips}
                      </div>
                      
                      <div className="flex gap-1 justify-center mt-1">
                        <div className="bg-slate-900/80 rounded-lg p-1.5 md:p-2 text-center border border-slate-700 w-full">
                          <span className="text-slate-400 text-[9px] md:text-[10px] font-bold block mb-0.5 tracking-wider">ベット額</span>
                          <span className="font-black text-white text-sm md:text-lg">{player.roundBet}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Action Panel for current player */}
            {isPlayingPhase && currentPlayer && currentPlayer.status === 'active' && (
              <div className="mt-4 bg-slate-800 rounded-3xl p-4 md:p-6 shadow-2xl border-2 border-slate-600 flex flex-col md:flex-row gap-4 md:gap-6 items-center justify-between max-w-4xl mx-auto w-full z-10 relative">
                
                {/* Player Info Badge */}
                <div className="flex items-center gap-3 md:gap-4 w-full md:w-auto bg-slate-900 p-2 md:p-3 rounded-2xl border border-slate-700">
                  <div className="w-12 h-12 md:w-14 md:h-14 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center font-black text-xl md:text-2xl shadow-inner">
                    {currentPlayer.id + 1}
                  </div>
                  <div className="pr-2 md:pr-4">
                    <div className="text-emerald-400 text-[10px] md:text-xs font-bold tracking-wider mb-0.5 md:mb-1">アクション待ち</div>
                    <div className="font-black text-lg md:text-xl truncate max-w-[120px] md:max-w-[200px]">{currentPlayer.name}</div>
                  </div>
                </div>

                {/* Actions */}
                <div className="flex flex-wrap md:flex-nowrap gap-2 md:gap-3 w-full md:w-auto justify-end">
                  <button 
                    onClick={() => handleAction('fold')}
                    className="px-4 md:px-6 py-3 md:py-4 bg-slate-700/50 hover:bg-red-900/80 text-red-300 hover:text-white rounded-2xl font-black text-base md:text-lg transition-all flex-1 md:flex-none border border-slate-600 hover:border-red-500"
                  >
                    FOLD
                  </button>
                  
                  {currentMaxBet === currentPlayer.roundBet ? (
                    <button 
                      onClick={() => handleAction('check')}
                      className="px-6 md:px-8 py-3 md:py-4 bg-slate-600 hover:bg-slate-500 text-white rounded-2xl font-black text-base md:text-lg flex-1 md:flex-none border-b-4 border-slate-800 active:border-b-0 active:translate-y-1 transition-all"
                    >
                      CHECK
                    </button>
                  ) : (
                    <button 
                      onClick={() => handleAction('call')}
                      className="px-4 md:px-8 py-3 md:py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black text-base md:text-lg flex-1 md:flex-none border-b-4 border-blue-800 active:border-b-0 active:translate-y-1 transition-all flex flex-col items-center justify-center leading-none"
                    >
                      <span>CALL</span>
                      <span className="text-[10px] md:text-sm font-medium text-blue-200 mt-1">
                        {Math.min(currentPlayer.chips, currentMaxBet - currentPlayer.roundBet)}
                      </span>
                    </button>
                  )}

                  <div className="flex bg-slate-900 p-1.5 md:p-2 rounded-2xl border border-slate-700 w-full md:w-auto mt-2 md:mt-0">
                    <input 
                      type="number"
                      value={raiseInput}
                      onChange={(e) => setRaiseInput(e.target.value)}
                      className="w-20 md:w-24 bg-transparent px-2 text-white text-center font-black text-lg md:text-xl outline-none"
                    />
                    <button 
                      onClick={() => handleAction('raise', raiseInput)}
                      className="px-4 md:px-6 py-2 md:py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-black text-base md:text-lg transition-colors"
                    >
                      RAISE
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Showdown Panel */}
            {phase === 'showdown' && !overlayMessage && (
              <div className="mt-4 bg-slate-800 p-6 md:p-8 rounded-3xl border-2 border-amber-500 shadow-[0_0_30px_rgba(245,158,11,0.2)] text-center max-w-3xl mx-auto w-full z-10">
                <h2 className="text-2xl md:text-3xl font-black text-amber-400 mb-6 flex items-center justify-center gap-3">
                  <Trophy className="w-6 h-6 md:w-8 md:h-8"/>
                  勝者を選択
                </h2>
                <div className="flex flex-wrap justify-center gap-3 md:gap-4 mb-6 md:mb-8">
                  {players.filter(p => p.status !== 'folded').map(p => (
                    <button
                      key={p.id}
                      onClick={() => {
                        if (winners.includes(p.id)) {
                          setWinners(winners.filter(id => id !== p.id));
                        } else {
                          setWinners([...winners, p.id]);
                        }
                      }}
                      className={`px-6 md:px-8 py-4 md:py-6 rounded-2xl font-black text-lg md:text-xl transition-all border-4 ${
                        winners.includes(p.id) 
                          ? 'bg-amber-500 border-white text-black shadow-[0_0_20px_rgba(245,158,11,0.6)] scale-105' 
                          : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600 hover:border-slate-500'
                      }`}
                    >
                      {p.name}
                    </button>
                  ))}
                </div>
                <button 
                  onClick={confirmShowdownWinners}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 px-8 md:py-4 md:px-12 rounded-full text-lg md:text-xl shadow-lg hover:shadow-emerald-500/20 transition-all active:scale-95"
                >
                  チップを分配する
                </button>
              </div>
            )}

            {/* Result Panel (End of Hand) */}
            {phase === 'result' && !overlayMessage && (
              <div className="mt-4 bg-slate-800 p-4 md:p-6 rounded-3xl border-2 border-emerald-500 shadow-2xl flex items-center justify-between max-w-2xl mx-auto w-full z-10">
                <div className="text-xl md:text-2xl font-black text-emerald-400">
                  ラウンド終了
                </div>
                <button 
                  onClick={nextHand}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 px-6 md:py-4 md:px-8 rounded-full flex items-center gap-2 transition-all hover:pr-4 md:hover:pr-6"
                >
                  {maxRounds !== null && currentRound >= maxRounds ? '結果を見る' : '次のハンドへ'}
                  <ChevronRight className="w-5 h-5 md:w-6 md:h-6" />
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- Reactアプリを画面にマウント ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
